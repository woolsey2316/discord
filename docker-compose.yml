
services:
  backend:
    image: backend
    container_name: "backend"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=${PORT}
    ports:
      - ${PORT}=${PORT}
    volumes:
      - ./backend/client_log:/app/client_log
      - ./backend/server_log:/app/server_log
    networks:
      - appnetwork
    links:
      - mongo
    restart: always

  frontend:
    image: frontend
    container_name: "frontend"
    ports:
      - ${PRODUCTION_SERVER_PORT}:80
    networks:
      - appnetwork
    links:
      - backend
    restart: always

  mongo:
    image: mongo:latest
    container_name: "mongo"
    restart: always
    ports: 
      - ${MONGO_PORT}:${MONGO_PORT}
    volumes:
      - ./mongo/data:/data/db
    networks:
      - appnetwork
    environment:
      MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

  networks:
    appnetwork
